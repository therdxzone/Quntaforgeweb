databases:
  - name: quantaforge-db
    plan: free
services:
  - type: web
    name: quantaforge
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: quantaforge-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PTERO_URL
        sync: false
      - key: PTERO_API_KEY
        sync: false
      - key: PTERO_NEST_ID
        sync: false
      - key: PTERO_EGG_ID
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
